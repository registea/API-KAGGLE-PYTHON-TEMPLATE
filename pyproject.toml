[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "API-KAGGLE-PYTHON-TEMPLATE"
version = "0.1.0"
description = "Reusable template for developing Python training code locally and running jobs on Kaggle"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
submit = ["kaggle"]
dev = ["mypy>=1.19,<2", "pytest>=8", "ruff>=0.6", "pre-commit==4.2.0", "types-PyYAML>=6,<7"]

[project.scripts]
training-submit = "training.main:main"
training-run = "training.job.execute:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["training*"]
exclude = ["*.tests*"]

[tool.setuptools.package-data]
training = ["job/cfg/*.yaml", "job/cfg/*.json"]

[tool.pytest.ini_options]
testpaths = ["src/training/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 80
